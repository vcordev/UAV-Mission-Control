name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UavMissionControl.slnx

      - name: Build
        run: dotnet build UavMissionControl.slnx --no-restore -c Release

      - name: Test - Core
        run: dotnet test tests/UavMissionControl.Core.Tests --no-build -c Release --logger trx --results-directory TestResults

      - name: Test - App
        # --filter excludes the two deliberately-unresolved, intentionally-failing known-defect
        # regression tests (docs/defects/07, 08) from the CI gate. They still exist, still run
        # on demand (`dotnet test --filter "Category=KnownDefect"`), and are documented in
        # docs/test-strategy.md - they are excluded here, not hidden or skipped.
        run: dotnet test tests/UavMissionControl.App.Tests --no-build -c Release --filter "Category!=KnownDefect" --logger trx --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults

  ui-automation-test:
    needs: build-and-unit-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UavMissionControl.slnx

      - name: Build App
        run: dotnet build src/UavMissionControl.App -c Release

      - name: UI automation tests
        # Same exclusion as the App test step above - see the comment there.
        run: dotnet test tests/UavMissionControl.UiAutomation.Tests -c Release --filter "Category!=KnownDefect" --logger trx --results-directory TestResults

      - name: Upload UI automation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-results
          path: TestResults
