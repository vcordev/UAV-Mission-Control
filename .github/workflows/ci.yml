name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UavMissionControl.slnx

      - name: Build
        run: dotnet build UavMissionControl.slnx --no-restore -c Release

      - name: Test - Core
        run: dotnet test tests/UavMissionControl.Core.Tests --no-build -c Release --logger trx --results-directory TestResults

      - name: Test - App
        run: dotnet test tests/UavMissionControl.App.Tests --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults

  ui-automation-test:
    needs: build-and-unit-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UavMissionControl.slnx

      - name: Build App
        run: dotnet build src/UavMissionControl.App -c Release

      - name: UI automation tests
        run: dotnet test tests/UavMissionControl.UiAutomation.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload UI automation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-results
          path: TestResults
